name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Create .env (Supabase)
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-https://fezyqdcoduzsplsehqgd.supabase.co}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-sb_publishable_TYclpdpr2rhpYJMs9A4F0g_6KLfHT-F}" >> .env
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Expo prebuild (generate android project)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/nonkz-membership.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonkz-membership-apk
          path: artifacts/nonkz-membership.apk
          if-no-files-found: error
